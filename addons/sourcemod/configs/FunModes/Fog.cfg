// Dynamic Fog presets - re-read every map change.
//
// "!fog preset <name>" applies one ("!fog preset <name> 10" blends it in over 10 s). "!fog presets" lists them.
//   start / end   fog distances (negative start = fog begins in front of your face)
//   color         "r g b"           color2   second colour, only used when blend is 1
//   density       0-1 (how opaque the fog gets at "end")
//   farz          far clip: the world isn't drawn past it (-1 = off). Keep it a bit past "end" or the
//                 cut-off shows as a hard edge.
//   blend         0 / 1 - 1 mixes color and color2 depending on which way you look
//   enable        0 / 1 (default 1)
// Every preset sets every value, so switching presets never inherits leftovers from the last one.
"DynamicFog"
{
	"Presets"
	{
		// ================================================================ utility
		// No fog at all (the map's own controllers are still overridden - use !fog reset for the map's own fog)
		"clear"
		{
			"enable"    "0"
			"start"     "0"
			"end"       "2000"
			"color"     "125 125 125"
			"blend"     "0"
			"farz"      "-1"
			"density"   "1.0"
		}
